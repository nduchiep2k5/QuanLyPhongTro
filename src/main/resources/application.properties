spring.application.name=QuanLyPhongTro
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quanlyphongtro}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=${MIGRATIONS_ENABLED:false}
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB
app.upload-dir=${UPLOAD_DIR:./uploads}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.openai-api-key=${OPENAI_API_KEY:}
app.mail-mode=${MAIL_MODE:smtp}
app.mail-from=${MAIL_FROM:no-reply@example.invalid}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.error.include-message=never
server.error.include-stacktrace=never
