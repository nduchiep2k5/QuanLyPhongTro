<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}">
</header>
<main class="container">
<div th:replace="~{fragments/layout :: notices}">
</div>
<div class="panel narrow">
<h1>Đặt lại mật khẩu</h1>
<form th:action="@{/auth/reset}" method="post">
<input type="hidden" name="token" th:value="${token}">
<label>Mật khẩu mới<input type="password" name="password" required minlength="10" maxlength="64" autocomplete="new-password">
</label>
<small>10–64 ký tự, không quá 72 byte UTF-8.</small>
<button class="full">Lưu mật khẩu mới</button>
</form>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}">
</footer>
<script th:src="@{/js/app.js}" defer>
</script>
</body>
</html>
