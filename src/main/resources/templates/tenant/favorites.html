<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}">
</header>
<main class="container">
<div th:replace="~{fragments/layout :: notices}">
</div>
<div class="page-heading">
<p class="eyebrow">DANH SÁCH CỦA BẠN</p>
<h1>Phòng trọ yêu thích</h1>
</div>
<div class="empty" th:if="${items.isEmpty()}">Bạn chưa lưu phòng nào. <a th:href="@{/rooms}">Khám phá phòng trọ →</a>
</div>
<div class="room-grid">
<div th:each="i : ${items}">
<th:block th:if="${i.room != null}">
<article th:replace="~{fragments/card :: card(${i.room})}">
</article>
</th:block>
<div class="panel" th:if="${i.room == null}">Phòng không còn công khai hoặc đang hết khả dụng.</div>
<form class="favorite-remove" th:action="@{/tenant/favorites/{id}(id=${i.roomId})}" method="post">
<input type="hidden" name="add" value="false">
<button class="secondary full">Bỏ yêu thích</button>
</form>
</div>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}">
</footer>
<script th:src="@{/js/app.js}" defer>
</script>
</body>
</html>
